name: sweep

on:
  schedule:
    # NOT on the hour. GitHub documents that the schedule event is delayed
    # under load and that queued jobs may be DROPPED, with load concentrated
    # at the start of each hour - so it recommends a different minute.
    # Verified: 2026-08-31, docs/actions "Events that trigger workflows".
    #
    # Running at :17 and :47 is the hedge: two chances an hour, neither in the
    # contended slot, so a dropped run costs half an hour instead of the whole
    # day. Minutes are free and unmetered on a public repo, so the only cost
    # of the second run is a row in the sweep log.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many hourly sweeps this job should run before exiting"
        default: "5"

concurrency:
  group: sweep
  # The newest run WINS, and that is deliberate.
  #
  # A sweep job now lives for hours (see the loop below), which makes a
  # queued-behind policy actively harmful in two ways: a dispatched sweep
  # cannot start until the running loop finishes - so pushing a fix and then
  # asking for a sweep silently waits hours - and the running loop is pinned
  # to whatever commit it checked out when it began, so it keeps writing
  # results from stale code long after a fix has merged.
  #
  # Cancelling costs nothing: each iteration commits its own sweep row before
  # sleeping, so an interrupted loop loses only an idle sleep.
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    # Long by design: this job sweeps hourly from the inside (see the loop
    # below), so it lives for hours rather than minutes. The ceiling on a
    # GitHub-hosted job is 6 hours; this stays under it.
    timeout-minutes: 340
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci || npm install
      # One job, several sweeps, an hour apart.
      #
      # GitHub's scheduler is best-effort: it documents that `schedule` is
      # delayed under load and that queued runs may be DROPPED. Measured on
      # this repo, it is not merely late - across 31 Aug it fired twice all
      # day, and missed six consecutive :17/:47 slots. No cron expression
      # fixes that, because the problem is not which minute we ask for.
      #
      # So the schedule is demoted to a STARTER, and the cadence is kept
      # inside the job: each firing runs several sweeps an hour apart. One
      # lucky trigger now buys ~5 hours of hourly data instead of a single
      # sample. Actions minutes are free and unmetered on a public repo, so
      # the runner time costs nothing.
      #
      # A failed sweep does not abandon the remaining hours - it is recorded
      # and the loop continues, then the step fails at the end so the issue
      # still gets opened.
      - name: Sweep hourly for the life of this job
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -u
          total="${{ inputs.iterations || '5' }}"
          failures=0
          for i in $(seq 1 "$total"); do
            echo "::group::sweep $i of $total"
            if ! npm run sweep; then
              failures=$((failures + 1))
              echo "sweep $i failed; continuing so the remaining hours still run"
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$total" ]; then
              echo "sleeping 55 minutes before sweep $((i + 1))"
              sleep 3300
            fi
          done
          echo "$failures of $total sweeps failed"
          [ "$failures" -eq 0 ]

      # Ground truth for the parser. The cleaned text loses the sale price when
      # a strikethrough anchor is present, so the parser is written against raw
      # HTML and tested against a committed fixture - never against guesswork.
      - name: Upload raw HTML fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: fixtures/raw/
          retention-days: 3
          if-no-files-found: warn

      - name: Report a failed sweep
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'sweep: last run failed';
            const { data } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [],
            });
            const existing = data.find(i => i.title === title);
            const body = `Sweep run ${context.runId} failed.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
