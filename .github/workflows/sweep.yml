name: sweep

on:
  schedule:
    - cron: "0 19 * * *"   # 02:00 ICT
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci || npm install
      - name: Run the nightly sweep
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run sweep

      - name: Report a failed sweep
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'sweep: last run failed';
            const { data } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [],
            });
            const existing = data.find(i => i.title === title);
            const body = `Sweep run ${context.runId} failed.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
