name: sweep

# Started ONLY by dispatch - by the previous run's handoff step, by the
# watchdog in sweep-watchdog.yml, or by a human pressing the button.
#
# There is deliberately no `schedule:` here any more, and removing it was not
# a simplification - it was a bug fix. A cron on THIS workflow fires whether
# or not a sweep is already running, and `cancel-in-progress` below would then
# kill the healthy run twice an hour, every hour. No run would ever reach its
# next target, every handoff would be skipped as cancelled, and the chain
# would be decorative. The recovery trigger must not be able to cancel the
# thing it is recovering, so it lives in its own workflow and checks first.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many hourly sweeps this job should run before exiting"
        default: "4"

concurrency:
  group: sweep
  # The newest run WINS, and that is deliberate.
  #
  # A sweep job now lives for hours (see the loop below), which makes a
  # queued-behind policy actively harmful in two ways: a dispatched sweep
  # cannot start until the running loop finishes - so pushing a fix and then
  # asking for a sweep silently waits hours - and the running loop is pinned
  # to whatever commit it checked out when it began, so it keeps writing
  # results from stale code long after a fix has merged.
  #
  # Cancelling costs nothing: each iteration commits its own sweep row before
  # sleeping, so an interrupted loop loses only an idle sleep.
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    # Long by design: this job sweeps hourly from the inside (see the loop
    # below), so it lives for hours rather than minutes. A GitHub-hosted job
    # is terminated at 360 minutes and the cap cannot be raised, so this stays
    # under it - and 4 iterations use ~250 of those minutes.
    # Verified: 2026-09-01, docs.github.com "Limits in GitHub Actions".
    timeout-minutes: 340
    permissions:
      contents: read
      issues: write
      # Only for the handoff below: this job asks GitHub to start its own
      # successor. workflow_dispatch is one of the two events GITHUB_TOKEN is
      # explicitly allowed to raise - the recursion block that silences
      # push-triggered workflows does not apply to it.
      # Verified: 2026-09-01, GitHub Changelog 2022-09-08 "Use the GITHUB_TOKEN
      # with workflow_dispatch and repository_dispatch".
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci || npm install
      # One job, several sweeps, an hour apart.
      #
      # GitHub's scheduler is best-effort: it documents that `schedule` is
      # delayed under load and that queued runs may be DROPPED.
      # Verified: 2026-08-31, docs/actions "Events that trigger workflows".
      #
      # Measured on this repo it is not merely late: it fired 3 times in 2 days
      # and left holes of 126 and 193 minutes. No cron expression fixes that,
      # because the problem is not which minute we ask for.
      #
      # So the cadence lives inside the job: each start runs several sweeps an
      # hour apart, and the last thing the job does is book its successor.
      # Actions minutes are free and unmetered on a public repo, so holding a
      # runner through the sleeps costs nothing.
      #
      # A failed sweep does not abandon the remaining hours - it is recorded
      # and the loop continues, then the step fails at the end so the issue
      # still gets opened.
      - name: Sweep hourly for the life of this job
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Optional, and free-tier. Without it the sweep runs exactly as
          # before and simply produces no resolution proposals.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Every sweep after the first lands on this minute past the hour.
          # Not :00 - GitHub documents load as concentrated at the start of
          # each hour and recommends a different minute.
          # Verified: 2026-08-31, docs/actions "Events that trigger workflows".
          TARGET_MINUTE: "05"
          ITERATIONS: ${{ inputs.iterations || '4' }}
        run: |
          set -u

          # Sweeps land on a CLOCK, not on a stopwatch.
          #
          # `sleep 3300` after each sweep added every sweep's own duration to
          # the gap, so the log drifted - 58, 59, 61 minutes - and no two days
          # lined up. Targets are absolute instead: the next :05, then +1h,
          # +1h. A sweep that runs long eats into its own sleep rather than
          # pushing the next one later.
          now() { date -u +%s; }
          target=$(date -u -d "$(date -u +%Y-%m-%dT%H):${TARGET_MINUTE}:00" +%s)

          failures=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::sweep $i of $ITERATIONS"
            if ! npm run sweep; then
              failures=$((failures + 1))
              echo "sweep $i failed; continuing so the remaining hours still run"
            fi
            echo "::endgroup::"

            # Sleep even after the LAST sweep. The successor starts as soon as
            # this job exits and sweeps immediately, so handing off straight
            # after a sweep would put two sweeps two minutes apart. Waiting out
            # the final hour is what makes the handoff invisible in the log.
            #
            # Stepping the target forward in a loop covers both the first
            # iteration (whose target may already be in the past) and a sweep
            # that overran its slot: a missed target is skipped, never slept
            # through backwards.
            while [ "$target" -le "$(now)" ]; do target=$((target + 3600)); done
            echo "sleeping until $(date -u -d "@$target" +%H:%M) UTC"
            # Read the clock ONCE. Calling now() again inside the sleep
            # argument reopens the gap the while-loop just closed: if the
            # target is a second away, time can cross it between the check and
            # the subtraction, and `sleep -1` is an error that would kill the
            # step and with it the chain.
            wait=$((target - $(now)))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done

          echo "$failures of $ITERATIONS sweeps failed"
          [ "$failures" -eq 0 ]

      # The chain: this run starts the next one.
      #
      # Steady state is each run booking its successor, so nothing outside the
      # repo has to keep time. sweep-watchdog.yml is the recovery path and only
      # acts when this chain is already dead.
      #
      # `if: success()` is load-bearing, not tidiness. A cancelled run must
      # dispatch NOTHING: the run that cancelled it is already running, and a
      # dying run that booked a successor would have that successor cancel its
      # own canceller - forever, with no sweep ever completing. A failed run is
      # silent for the same reason it is safe: the watchdog's cron picks the
      # chain back up within 30 minutes.
      - name: Hand off to the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          # --repo explicitly, like the watchdog: inferring it from .git works
          # until a step changes directory or the checkout is shallow in some
          # future way, and a handoff that silently targets nothing breaks the
          # chain until the watchdog notices.
          gh workflow run sweep.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f iterations="${{ inputs.iterations || '4' }}"
          echo "next run requested on $REF"

      # Ground truth for the parser. The cleaned text loses the sale price when
      # a strikethrough anchor is present, so the parser is written against raw
      # HTML and tested against a committed fixture - never against guesswork.
      - name: Upload raw HTML fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: fixtures/raw/
          retention-days: 3
          if-no-files-found: warn

      - name: Report a failed sweep
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'sweep: last run failed';
            const { data } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [],
            });
            const existing = data.find(i => i.title === title);
            const body = `Sweep run ${context.runId} failed.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
